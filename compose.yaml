services:
  postgres:
    image: postgres:17-alpine
    container_name: propiedad_al_dia_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: propiedad_al_dia
    ports:
      - '5436:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d propiedad_al_dia']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
